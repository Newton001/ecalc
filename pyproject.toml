[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecalc"
version = "0.1.0"
description = "Tiny electronics calculator CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ecalc = "ecalc.cli:main"

[tool.setuptools]
packages = ["ecalc"]
